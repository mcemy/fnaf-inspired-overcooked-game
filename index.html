<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-fullscreen"
    />
    <title>🍕 FNAF Pizza Kitchen</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        -webkit-user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        background: #1a1a2e;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Comic Sans MS", Arial, sans-serif;
        touch-action: none;
      }

      #game-container {
        position: relative;
        max-width: 100vw;
        max-height: 100vh;
      }

      canvas {
        display: block;
        border: 4px solid #ffa500;
        border-radius: 10px;
        box-shadow: 0 0 40px rgba(255, 165, 0, 0.5);
        background: #1d1d44;
      }

      /* Mobile controls */
      .mobile-controls {
        display: none;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 200px;
        z-index: 1000;
        pointer-events: none;
      }

      .mobile-controls.active {
        display: block;
      }

      .joystick {
        position: absolute;
        left: 50px;
        bottom: 50px;
        width: 120px;
        height: 120px;
        pointer-events: all;
      }

      .joystick-base {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        background: rgba(255, 165, 0, 0.3);
        border: 3px solid rgba(255, 165, 0, 0.6);
        position: absolute;
      }

      .joystick-stick {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: rgba(255, 165, 0, 0.8);
        border: 3px solid #ffa500;
        position: absolute;
        left: 30px;
        top: 30px;
        transition: all 0.1s;
      }

      .action-button {
        position: absolute;
        right: 50px;
        bottom: 50px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: rgba(76, 175, 80, 0.8);
        border: 4px solid #4caf50;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        color: white;
        font-weight: bold;
        pointer-events: all;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        user-select: none;
      }

      .action-button:active {
        transform: scale(0.9);
        background: rgba(56, 142, 60, 0.9);
      }

      /* Loading indicator */
      .loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #ffa500;
        font-size: 24px;
        z-index: 999;
      }

      @media (max-width: 768px) {
        canvas {
          border-width: 2px;
          border-radius: 0;
          width: 100vw !important;
          height: 100vh !important;
          max-width: 100vw !important;
          max-height: 100vh !important;
        }

        body {
          background: #1d1d44;
        }
      }

      @media (orientation: landscape) and (max-height: 500px) {
        .mobile-controls {
          height: 150px;
        }
        .joystick {
          width: 90px;
          height: 90px;
          left: 30px;
          bottom: 30px;
        }
        .joystick-base {
          width: 90px;
          height: 90px;
        }
        .joystick-stick {
          width: 45px;
          height: 45px;
          left: 22.5px;
          top: 22.5px;
        }
        .action-button {
          width: 80px;
          height: 80px;
          right: 30px;
          bottom: 30px;
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <div class="loading">🍕 Carregando...</div>
    <div id="game-container"></div>

    <!-- Mobile Controls -->
    <div class="mobile-controls" id="mobileControls">
      <div class="joystick" id="joystick">
        <div class="joystick-base"></div>
        <div class="joystick-stick" id="joystickStick"></div>
      </div>
      <div class="action-button" id="actionButton">⚡</div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
